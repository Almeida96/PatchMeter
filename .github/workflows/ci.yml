name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and package
        shell: bash
        run: ./gradlew test installDist jacocoTestReport distZip --no-daemon --console=plain
      - name: Exercise packaged launchers and reports
        run: python checks/cli_smoke.py --install-dir build/install/patchmeter
      - name: Check real JaCoCo and Node LCOV reports
        run: python checks/coverage_integration.py --install-dir build/install/patchmeter
      - name: Install official MCP client
        run: python -m pip install --disable-pip-version-check -r checks/requirements.txt
      - name: Check MCP interoperability
        run: python checks/mcp_smoke.py --install-dir build/install/patchmeter
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: build/test-results/test/*.xml
      - name: Prepare distribution
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p build/publish
          cp build/distributions/patchmeter-0.1.0.zip build/publish/
          cd build/publish
          sha256sum patchmeter-0.1.0.zip > SHA256SUMS
      - name: Save distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: build/publish/*
          if-no-files-found: error
  release:
    name: Publish verified release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release PatchMeter 0.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: release
      - name: Publish distribution and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 release/patchmeter-0.1.0.zip release/SHA256SUMS --target "$GITHUB_SHA" --title "PatchMeter 0.1.0" --notes-file docs/release.md
